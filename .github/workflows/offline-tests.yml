name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scanner build and byte-search checks
        run: python3 tests/test_memscan.py
      - name: Parser and private-output checks
        run: python3 tests/test_extract_local_keys.py
